<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fretloop</title>
  <meta name="description" content="Fretloop is a guitar practice app.">
  <style>
    :root {
      --surface: #f7f7f8;
      --surface-panel: #ffffff;
      --text: #171719;
      --text-muted: #6a6a72;
      --outline: #d3d3da;
      --accent: #a82d54;
      --shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
      --radius: 22px;
      --max: 680px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(168, 45, 84, 0.08), transparent 22%),
        linear-gradient(180deg, #fafafb 0%, var(--surface) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(calc(100% - 32px), var(--max));
      margin: 0 auto;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 0;
    }

    .card {
      width: 100%;
      padding: 28px;
      border-radius: calc(var(--radius) + 2px);
      border: 1px solid rgba(232, 232, 237, 0.84);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(244, 244, 246, 0.98));
      box-shadow: var(--shadow);
      text-align: center;
    }

    .brand-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: var(--surface-panel);
      border: 1px solid rgba(232, 232, 237, 0.84);
      color: #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 56px);
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 22px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    @media (max-width: 420px) {
      .card {
        padding: 22px;
      }

      .brand-mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="Fretloop coming soon">
      <div class="brand-mark" aria-hidden="true">
        <img src="icon.svg" alt="">
      </div>
      <h1>Fretloop</h1>
      <div class="actions">
        <a class="button" href="https://apps.apple.com/" rel="noopener noreferrer">App Store</a>
      </div>
    </section>
  </main>
</body>
</html>
