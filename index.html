<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f7f8">
  <meta name="robots" content="index,follow">
  <meta name="description" content="Fretloop is a guitar practice app for tracking songs, loops, and technique goals with a calm, focused interface.">
  <meta name="application-name" content="Fretloop">
  <meta name="apple-mobile-web-app-title" content="Fretloop">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Fretloop">
  <meta property="og:title" content="Fretloop | Guitar practice app">
  <meta property="og:description" content="Track songs, practice loops, and technique goals in a focused guitar practice app.">
  <meta property="og:url" content="https://fretloop.app/">
  <meta property="og:image" content="https://fretloop.app/icon.svg">
  <meta property="og:image:alt" content="Fretloop app icon">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Fretloop | Guitar practice app">
  <meta name="twitter:description" content="Track songs, practice loops, and technique goals in a focused guitar practice app.">
  <meta name="twitter:image" content="https://fretloop.app/icon.svg">
  <link rel="canonical" href="https://fretloop.app/">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Fretloop | Guitar practice app</title>
  <style>
    :root {
      --surface: #f7f7f8;
      --text: #171719;
      --text-muted: #6a6a72;
      --shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
      --radius: 22px;
      --page-width: 680px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--surface);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(calc(100% - 32px), var(--page-width));
      margin: 0 auto;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 0;
    }

    .card {
      width: 100%;
      padding: 28px;
      border-radius: calc(var(--radius) + 2px);
      border: 1px solid rgba(232, 232, 237, 0.84);
      background: #ffffff;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .brand-mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: #ffffff;
      border: 1px solid rgba(232, 232, 237, 0.84);
      color: #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 56px);
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .copy {
      margin: 14px auto 0;
      max-width: 34rem;
      color: var(--text-muted);
      font-size: 16px;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 22px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: #171719;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      box-shadow: var(--shadow);
    }

    @media (max-width: 420px) {
      .card {
        padding: 22px;
      }

      .brand-mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="Fretloop home">
      <div class="brand-mark" aria-hidden="true">
        <img src="icon.svg" alt="">
      </div>
      <h1>Fretloop</h1>
      <div class="actions">
        <a class="button" href="https://apps.apple.com/gb/app/fretloop/id6761345559" rel="noopener noreferrer">App Store</a>
      </div>
    </section>
  </main>
</body>
</html>
